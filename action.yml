name: Release Flow Provenance
author: nbari
description: Validate release configuration and adapter contracts without executing project code. Requires Bash, Git 2.31+ and jq on Linux or macOS.
branding:
  icon: shield
  color: blue
inputs:
  operation:
    description: 'Operation to perform. Supported: validate (read-only; never executes the adapter).'
    required: false
    default: validate
  project-directory:
    description: 'Consumer project directory relative to GITHUB_WORKSPACE. Symlinks and traversal are rejected.'
    required: false
    default: '.'
  adapter:
    description: 'Optional executable adapter path relative to the project. Must match .release-flow.json; empty uses its adapter.'
    required: false
    default: ''
outputs:
  project:
    description: Validated project identifier.
    value: ${{ steps.validate.outputs.project }}
  project-directory:
    description: Absolute consumer project directory.
    value: ${{ steps.validate.outputs.project-directory }}
  adapter:
    description: Validated adapter path relative to the project.
    value: ${{ steps.validate.outputs.adapter }}
  runtime-revision:
    description: Full SHA when called by SHA or from a Git checkout; otherwise unresolved. Pin uses to a full SHA.
    value: ${{ steps.validate.outputs.runtime-revision }}
  validation-json:
    description: JSON validation result including protocol, pipeline pin and adapter_executed=false. Emitted only on success.
    value: ${{ steps.validate.outputs.validation-json }}
runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      env:
        RF_ACTION_PATH: ${{ github.action_path }}
        RF_ACTION_REF: ${{ github.action_ref }}
        RF_INPUT_OPERATION: ${{ inputs.operation }}
        RF_INPUT_PROJECT_DIRECTORY: ${{ inputs.project-directory }}
        RF_INPUT_ADAPTER: ${{ inputs.adapter }}
      run: bash "${RF_ACTION_PATH}/scripts/action.sh"
