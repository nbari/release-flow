# Temporary workflow for the first PR only. Delete after generating Cargo.lock.
name: Bootstrap Rust lockfile and formatting

on:
  push:
    branches: [bootstrap/pipeline-foundation]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'nbari/release-flow'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Generate and format
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock src
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Lock Rust dependencies and format bootstrap sources'
            git push origin HEAD:bootstrap/pipeline-foundation
          fi
