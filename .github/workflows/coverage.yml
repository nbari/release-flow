---
name: Coverage

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - name: Run tests with coverage
        run: cargo test --all-features --locked --verbose -- --nocapture
        env:
          RUST_BACKTRACE: full
          CARGO_INCREMENTAL: 0
          LLVM_PROFILE_FILE: coverage-%p-%m.profraw
          RUSTFLAGS: -Cinstrument-coverage -Ccodegen-units=1 -Clink-dead-code -Coverflow-checks=off
          RUSTDOCFLAGS: -Cinstrument-coverage -Ccodegen-units=1 -Clink-dead-code -Coverflow-checks=off

      - name: Install grcov
        run: if [[ ! -e ~/.cargo/bin/grcov ]]; then cargo install grcov --version 0.10.7 --locked; fi

      - name: Run grcov
        run: |
          grcov . --binary-path target/debug/ -s . -t lcov --branch --ignore-not-existing \
            --ignore '../**' --ignore '/*' -o coverage.lcov

      - name: Upload to codecov.io
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2
        with:
          fail-on-error: false
