---
name: Test & Build

on:
  push:
    branches:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A production promotion pushes the already-validated candidate commit to main
# and develop; it is not rebuilt or retested here (candidate.yml validated that
# exact SHA).
jobs:
  test:
    if: "${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: ') && contains(github.event.head_commit.message, 'Release-Mode: production')) }}"
    uses: ./.github/workflows/test.yml

  coverage:
    if: "${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: ') && contains(github.event.head_commit.message, 'Release-Mode: production')) }}"
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  build:
    name: Build (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    needs:
      - test

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get package name from Cargo.toml
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(awk -F '"' '/^name = / {print $2; exit}' Cargo.toml)
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Package name: $PACKAGE_NAME"

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      - name: Install system deps (musl)
        if: startsWith(matrix.build, 'linux')
        run: sudo apt-get update -y && sudo apt-get install -y musl-dev musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

  # Aggregate check for branch protection ("CI OK" is ci.yml's aggregate)
  build-ok:
    name: Build OK
    if: "${{ always() && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: ') && contains(github.event.head_commit.message, 'Release-Mode: production')) }}"
    needs:
      - test
      - coverage
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done
