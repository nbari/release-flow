# release-flow candidate pipeline, called at a pinned commit. Copy to
# .github/workflows/candidate.yml; replace b052911198824598bf38a0b0b1d77748f1024121 with the full
# commit SHA that .release-flow.json "pipeline.sha" also names.
name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  candidate:
    uses: nbari/release/.github/workflows/candidate.yml@b052911198824598bf38a0b0b1d77748f1024121
    with:
      adapter: tools/adapter.sh
    permissions:
      contents: write
      id-token: write
