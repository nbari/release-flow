# release-flow candidate pipeline, called at a pinned commit. Copy to
# .github/workflows/candidate.yml; replace 43d2b794259f1681fe729696520891fa5c3ba763 with the full
# commit SHA that .release-flow.json "pipeline.sha" also names.
name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  candidate:
    uses: nbari/release/.github/workflows/candidate.yml@43d2b794259f1681fe729696520891fa5c3ba763
    with:
      adapter: tools/adapter.sh
    permissions:
      contents: write
      id-token: write
