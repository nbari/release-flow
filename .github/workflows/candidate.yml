name: Candidate

# The only place release artifacts are built. Publishing never rebuilds: it
# reads the bytes retained here from durable storage, pinned by the manifest
# digest that the signed release tag carries. Callable via workflow_call;
# scripts always come from the workflow's own commit (job.workflow_sha).

on:
  push:
    branches: ['release/**']
  workflow_call:
    inputs:
      adapter:
        description: Adapter path relative to the consumer root; empty uses .release-flow.json
        required: false
        type: string
        default: ''
    outputs:
      candidate-sha:
        description: Exact consumer source SHA that was validated
        value: ${{ github.sha }}
      runtime-sha:
        description: Release-flow workflow and runtime SHA
        value: ${{ jobs.guard.outputs.pipeline_sha }}
      manifest-sha256:
        description: Verified candidate manifest digest
        value: ${{ jobs.assemble.outputs.manifest_sha256 }}
      artifact-name:
        description: Candidate artifact retained by this run
        value: ${{ jobs.assemble.outputs.artifact_name }}
    secrets:
      RELEASE_FLOW_S3_ACCESS_KEY_ID:
        required: false
      RELEASE_FLOW_S3_SECRET_ACCESS_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Guard candidate identity
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      project: ${{ steps.identity.outputs.project }}
      version: ${{ steps.identity.outputs.version }}
      mode: ${{ steps.identity.outputs.mode }}
      base_branch: ${{ steps.identity.outputs.base_branch }}
      base_commit: ${{ steps.identity.outputs.base_commit }}
      candidate_branch: ${{ steps.identity.outputs.candidate_branch }}
      adapter: ${{ steps.identity.outputs.adapter }}
      targets: ${{ steps.matrix.outputs.targets }}
      storage_uri: ${{ steps.matrix.outputs.storage_uri }}
      pipeline_mode: ${{ steps.pipeline.outputs.pipeline_mode }}
      pipeline_repository: ${{ steps.pipeline.outputs.pipeline_repository }}
      pipeline_sha: ${{ steps.pipeline.outputs.pipeline_sha }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/candidate.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Verify identity and trailers
        id: identity
        env:
          REQUESTED_ADAPTER: ${{ inputs.adapter }}
        run: |
          bash "${RF_PIPELINE}/scripts/candidate-guard.sh" --ref "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" --adapter "${REQUESTED_ADAPTER}" | tee -a "${GITHUB_OUTPUT}"

      - name: Package matrix and storage
        id: matrix
        env:
          ADAPTER: ${{ steps.identity.outputs.adapter }}
          RELEASE_FLOW_STORAGE_URI: ${{ vars.RELEASE_FLOW_STORAGE_URI }}
        run: |
          targets="$(bash "${RF_PIPELINE}/scripts/candidate-targets.sh" --adapter "${ADAPTER}")"
          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"
          storage_uri="${RELEASE_FLOW_STORAGE_URI:-$(jq -r '.storage.uri // empty' .release-flow.json)}"
          echo "storage_uri=${storage_uri}" >> "${GITHUB_OUTPUT}"
          echo "Package legs: ${targets}"
          echo "Durable storage: ${storage_uri:-not configured (candidate will not be promotable)}"

  test:
    name: Test exact candidate
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Run adapter verify
        env:
          ADAPTER: ${{ needs.guard.outputs.adapter }}
        run: |
          "./${ADAPTER}" verify

  package:
    name: Package (${{ matrix.target || 'all' }})
    needs: guard
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Package this target
        env:
          ADAPTER: ${{ needs.guard.outputs.adapter }}
          VERSION: ${{ needs.guard.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          epoch="$(git log -1 --format=%ct)"
          if [[ -n "${TARGET}" ]]; then
            export RELEASE_FLOW_TARGET="${TARGET}"
          fi
          SOURCE_DATE_EPOCH="${epoch}" "./${ADAPTER}" package "${VERSION}" "${RUNNER_TEMP}/part"

      - name: Upload target part (internal; expires in one day)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-part-${{ github.sha }}-${{ matrix.target || 'all' }}
          path: ${{ runner.temp }}/part/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  assemble:
    name: Assemble candidate manifest
    needs: [guard, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact_name: ${{ steps.manifest.outputs.artifact_name }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/candidate.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Download every target part
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: candidate-part-${{ github.sha }}-*
          merge-multiple: true
          path: dist

      - name: Generate artifact inventory
        env:
          ADAPTER: ${{ needs.guard.outputs.adapter }}
          VERSION: ${{ needs.guard.outputs.version }}
          PIPELINE_REPOSITORY: ${{ needs.guard.outputs.pipeline_repository }}
          PIPELINE_SHA: ${{ needs.guard.outputs.pipeline_sha }}
        run: |
          "./${ADAPTER}" inventory "${VERSION}" | jq --arg r "${PIPELINE_REPOSITORY}" --arg s "${PIPELINE_SHA}" \
            '.build_info.release_flow = {repository:$r, sha:$s}' > "${RUNNER_TEMP}/inventory.json"

      - name: Generate artifact manifest
        id: manifest
        env:
          ADAPTER: ${{ needs.guard.outputs.adapter }}
          PROJECT: ${{ needs.guard.outputs.project }}
          VERSION: ${{ needs.guard.outputs.version }}
          MODE: ${{ needs.guard.outputs.mode }}
          BASE_BRANCH: ${{ needs.guard.outputs.base_branch }}
          BASE_COMMIT: ${{ needs.guard.outputs.base_commit }}
          CANDIDATE_BRANCH: ${{ needs.guard.outputs.candidate_branch }}
        run: |
          epoch="$(git log -1 --format=%ct)"
          manifest_sha="$(bash "${RF_PIPELINE}/scripts/candidate-manifest.sh" \
            --dir dist \
            --inventory "${RUNNER_TEMP}/inventory.json" \
            --project "${PROJECT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --mode "${MODE}" \
            --base-branch "${BASE_BRANCH}" \
            --base-commit "${BASE_COMMIT}" \
            --candidate-branch "${CANDIDATE_BRANCH}" \
            --candidate-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-date-epoch "${epoch}" \
            --adapter "${ADAPTER}")"
          echo "manifest_sha256=${manifest_sha}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=candidate-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Self-verify candidate directory before upload
        env:
          MANIFEST_SHA256: ${{ steps.manifest.outputs.manifest_sha256 }}
        run: |
          bash "${RF_PIPELINE}/scripts/verify-candidate.sh" \
            --dir dist \
            --commit "${GITHUB_SHA}" \
            --manifest-sha256 "${MANIFEST_SHA256}"

      - name: Upload candidate artifacts (not a public release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Verify downloaded candidate
    needs: [guard, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/candidate.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Download candidate artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.assemble.outputs.artifact_name }}
          path: candidate

      - name: Verify checksums, manifest and source identity
        env:
          PROJECT: ${{ needs.guard.outputs.project }}
          VERSION: ${{ needs.guard.outputs.version }}
          MODE: ${{ needs.guard.outputs.mode }}
          BASE_COMMIT: ${{ needs.guard.outputs.base_commit }}
          MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest_sha256 }}
        run: |
          bash "${RF_PIPELINE}/scripts/verify-candidate.sh" \
            --dir candidate \
            --commit "${GITHUB_SHA}" \
            --version "${VERSION}" \
            --mode "${MODE}" \
            --base-commit "${BASE_COMMIT}" \
            --project "${PROJECT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --manifest-sha256 "${MANIFEST_SHA256}"

  retain:
    name: Retain candidate in durable storage
    needs: [guard, test, assemble, verify]
    if: needs.guard.outputs.mode == 'production' && needs.guard.outputs.storage_uri != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: candidate-storage
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/candidate.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Download candidate artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.assemble.outputs.artifact_name }}
          path: candidate

      - name: Storage credentials
        env:
          RELEASE_FLOW_STORAGE_URI: ${{ needs.guard.outputs.storage_uri }}
          RELEASE_FLOW_AWS_ROLE_ARN: ${{ vars.RELEASE_FLOW_AWS_ROLE_ARN }}
          RELEASE_FLOW_S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_FLOW_S3_ACCESS_KEY_ID }}
          RELEASE_FLOW_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_FLOW_S3_SECRET_ACCESS_KEY }}
        run: bash "${RF_PIPELINE}/scripts/storage/ci-credentials.sh"

      - name: Store blobs and the candidate record (create-only)
        env:
          RELEASE_FLOW_STORAGE_URI: ${{ needs.guard.outputs.storage_uri }}
          MANIFEST_SHA256: ${{ needs.assemble.outputs.manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bash "${RF_PIPELINE}/scripts/storage/storage.sh" retain-candidate \
            --dir candidate \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}"

  report:
    name: Candidate OK
    if: always() && github.event.deleted != true
    needs: [guard, test, package, assemble, verify, retain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize candidate validation
        env:
          GUARD_RES: ${{ needs.guard.result }}
          TEST_RES: ${{ needs.test.result }}
          PKG_RES: ${{ needs.package.result }}
          ASSEMBLE_RES: ${{ needs.assemble.result }}
          VERIFY_RES: ${{ needs.verify.result }}
          RETAIN_RES: ${{ needs.retain.result }}
          VERSION: ${{ needs.guard.outputs.version }}
          MODE: ${{ needs.guard.outputs.mode }}
          PIPELINE: "${{ needs.guard.outputs.pipeline_mode }} ${{ needs.guard.outputs.pipeline_repository }}@${{ needs.guard.outputs.pipeline_sha }}"
          STORAGE_URI: ${{ needs.guard.outputs.storage_uri }}
          COMMIT: ${{ github.sha }}
          MANIFEST_SHA: ${{ needs.assemble.outputs.manifest_sha256 }}
        run: |
          cat <<EOF >> "${GITHUB_STEP_SUMMARY}"
          # Release Candidate Validation Report

          | Property | Value |
          | --- | --- |
          | Version | ${VERSION:-unknown} |
          | Mode | ${MODE:-unknown} |
          | Pipeline | ${PIPELINE} |
          | Candidate Commit | \`${COMMIT}\` |
          | Manifest SHA256 | \`${MANIFEST_SHA:-unknown}\` |
          | Guard | ${GUARD_RES} |
          | Tests & Checks | ${TEST_RES} |
          | Package legs | ${PKG_RES} |
          | Assemble manifest | ${ASSEMBLE_RES} |
          | Artifact Verification | ${VERIFY_RES} |
          | Durable retention | ${RETAIN_RES} |

          EOF

          retain_ok=false
          if [[ "${RETAIN_RES}" == "success" ]]; then
            retain_ok=true
          elif [[ "${RETAIN_RES}" == "skipped" && ( "${MODE}" == "test-only" || -z "${STORAGE_URI}" ) ]]; then
            retain_ok=true
          fi

          if [[ "${GUARD_RES}" == "success" && "${TEST_RES}" == "success" && "${PKG_RES}" == "success" && \
                "${ASSEMBLE_RES}" == "success" && "${VERIFY_RES}" == "success" && "${retain_ok}" == "true" ]]; then
            if [[ "${MODE}" == "test-only" ]]; then
              echo "::notice::TEST-ONLY candidate validated. This candidate is not promotable to production."
            elif [[ -z "${STORAGE_URI}" ]]; then
              echo "::warning::Production candidate validated, but durable storage is not configured: it is not promotable."
            else
              echo "::notice::Production release candidate VALIDATED and retained for commit ${COMMIT}."
            fi
            exit 0
          else
            echo "::error::Release candidate validation failed."
            exit 1
          fi
