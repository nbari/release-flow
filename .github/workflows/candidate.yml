name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Guard candidate identity
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      project: ${{ steps.identity.outputs.project }}
      version: ${{ steps.identity.outputs.version }}
      mode: ${{ steps.identity.outputs.mode }}
      base_branch: ${{ steps.identity.outputs.base_branch }}
      base_commit: ${{ steps.identity.outputs.base_commit }}
      candidate_branch: ${{ steps.identity.outputs.candidate_branch }}
      adapter: ${{ steps.identity.outputs.adapter }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Project toolchain (adapter prerequisite)
        run: rustup toolchain install stable --profile minimal

      - name: Verify identity and trailers
        id: identity
        run: |
          bash scripts/candidate-guard.sh --ref "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}" | tee -a "${GITHUB_OUTPUT}"

  test:
    name: Test exact candidate
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Run adapter verify
        env:
          ADAPTER: ${{ needs.guard.outputs.adapter }}
        run: |
          "./${ADAPTER}" verify

      - name: Release-pipeline self-tests
        run: |
          if [[ -f tests/pipeline/run.sh ]]; then
            if [[ -f tests/pipeline/ci-install-just.sh ]]; then
              bash tests/pipeline/ci-install-just.sh
              export PATH="${RUNNER_TEMP}/just-bin:${PATH}"
            fi
            bash tests/pipeline/run.sh
          fi

  package:
    name: Build and package candidate
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact_name: ${{ steps.manifest.outputs.artifact_name }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Generate artifact inventory
        env:
          ADAPTER: ${{ needs.guard.outputs.adapter }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          "./${ADAPTER}" inventory "${VERSION}" > "${RUNNER_TEMP}/inventory.json"

      - name: Package artifacts
        env:
          ADAPTER: ${{ needs.guard.outputs.adapter }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          epoch="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "${GITHUB_ENV}"
          SOURCE_DATE_EPOCH="${epoch}" "./${ADAPTER}" package "${VERSION}" dist

      - name: Generate artifact manifest
        id: manifest
        env:
          ADAPTER: ${{ needs.guard.outputs.adapter }}
          PROJECT: ${{ needs.guard.outputs.project }}
          VERSION: ${{ needs.guard.outputs.version }}
          MODE: ${{ needs.guard.outputs.mode }}
          BASE_BRANCH: ${{ needs.guard.outputs.base_branch }}
          BASE_COMMIT: ${{ needs.guard.outputs.base_commit }}
          CANDIDATE_BRANCH: ${{ needs.guard.outputs.candidate_branch }}
        run: |
          manifest_sha="$(bash scripts/candidate-manifest.sh \
            --dir dist \
            --inventory "${RUNNER_TEMP}/inventory.json" \
            --project "${PROJECT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${VERSION}" \
            --mode "${MODE}" \
            --base-branch "${BASE_BRANCH}" \
            --base-commit "${BASE_COMMIT}" \
            --candidate-branch "${CANDIDATE_BRANCH}" \
            --candidate-commit "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-date-epoch "${SOURCE_DATE_EPOCH}" \
            --adapter "${ADAPTER}")"
          echo "manifest_sha256=${manifest_sha}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=candidate-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Self-verify candidate directory before upload
        env:
          MANIFEST_SHA256: ${{ steps.manifest.outputs.manifest_sha256 }}
        run: |
          bash scripts/verify-candidate.sh \
            --dir dist \
            --commit "${GITHUB_SHA}" \
            --manifest-sha256 "${MANIFEST_SHA256}"

      - name: Upload candidate artifacts (not a public release)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.manifest.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  verify:
    name: Verify downloaded candidate
    needs: [guard, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout verifier
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download candidate artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: candidate

      - name: Verify checksums, manifest and source identity
        env:
          PROJECT: ${{ needs.guard.outputs.project }}
          VERSION: ${{ needs.guard.outputs.version }}
          MODE: ${{ needs.guard.outputs.mode }}
          BASE_COMMIT: ${{ needs.guard.outputs.base_commit }}
          MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
        run: |
          bash scripts/verify-candidate.sh \
            --dir candidate \
            --commit "${GITHUB_SHA}" \
            --version "${VERSION}" \
            --mode "${MODE}" \
            --base-commit "${BASE_COMMIT}" \
            --project "${PROJECT}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --manifest-sha256 "${MANIFEST_SHA256}"

  report:
    name: Candidate OK
    if: always() && github.event.deleted != true
    needs: [guard, test, package, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize candidate validation
        env:
          GUARD_RES: ${{ needs.guard.result }}
          TEST_RES: ${{ needs.test.result }}
          PKG_RES: ${{ needs.package.result }}
          VERIFY_RES: ${{ needs.verify.result }}
          VERSION: ${{ needs.guard.outputs.version }}
          MODE: ${{ needs.guard.outputs.mode }}
          COMMIT: ${{ github.sha }}
          MANIFEST_SHA: ${{ needs.package.outputs.manifest_sha256 }}
        run: |
          cat <<EOF >> "${GITHUB_STEP_SUMMARY}"
          # Release Candidate Validation Report

          | Property | Value |
          | --- | --- |
          | Version | ${VERSION:-unknown} |
          | Mode | ${MODE:-unknown} |
          | Candidate Commit | \`${COMMIT}\` |
          | Manifest SHA256 | \`${MANIFEST_SHA:-unknown}\` |
          | Guard | ${GUARD_RES} |
          | Tests & Checks | ${TEST_RES} |
          | Build & Package | ${PKG_RES} |
          | Artifact Verification | ${VERIFY_RES} |

          EOF

          if [[ "${GUARD_RES}" == "success" && "${TEST_RES}" == "success" && \
                "${PKG_RES}" == "success" && "${VERIFY_RES}" == "success" ]]; then
            if [[ "${MODE}" == "test-only" ]]; then
              echo "::notice::TEST-ONLY candidate validated. This candidate is not promotable to production."
            else
              echo "::notice::Production release candidate VALIDATED for commit ${COMMIT}."
            fi
            exit 0
          else
            echo "::error::Release candidate validation failed."
            exit 1
          fi
