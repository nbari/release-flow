name: Release

# A pushed X.Y.Z tag is the publish trigger. This workflow does not rebuild:
# it publishes the candidate inventory (archives, Windows zip, Linux deb/rpm,
# crate) retained for that exact commit. Recovery re-dispatches one channel
# with current publisher code against the same tag and bytes (`just release-retry`).
# Callable via workflow_call; identity from the signed tag, bytes from storage,
# publisher code from job.workflow_sha.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Promoted release version (X.Y.Z)
        required: true
        type: string
      channel:
        description: Channel to (re)publish
        required: true
        type: choice
        options: [github-release, oci, crates-io, docs, helm]
  workflow_call:
    inputs:
      version:
        description: Promoted release version (X.Y.Z); empty uses the tag ref
        required: false
        type: string
        default: ''
      channel:
        description: Channel to (re)publish; empty publishes every channel
        required: false
        type: string
        default: ''
    secrets:
      RELEASE_FLOW_S3_ACCESS_KEY_ID:
        required: false
      RELEASE_FLOW_S3_SECRET_ACCESS_KEY:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      OCI_USERNAME:
        required: false
      OCI_PASSWORD:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A non-empty inputs.version wins, including when the caller event is push.
# Empty inputs (direct tag push, or a caller forwarding empty inputs) use the tag ref.
# A read-only plan rejects unknown/unconfigured selections before publisher jobs.
env:
  VERSION: ${{ inputs.version || github.ref_name }}
  RELEASE_FLOW_STORAGE_URI: ${{ vars.RELEASE_FLOW_STORAGE_URI }}
  RELEASE_FLOW_AWS_ROLE_ARN: ${{ vars.RELEASE_FLOW_AWS_ROLE_ARN }}

jobs:
  plan:
    name: Validate publisher selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      github-release: ${{ steps.selection.outputs.github-release }}
      oci: ${{ steps.selection.outputs.oci }}
      crates-io: ${{ steps.selection.outputs.crates-io }}
      docs: ${{ steps.selection.outputs.docs }}
      helm: ${{ steps.selection.outputs.helm }}
      channels: ${{ steps.selection.outputs.channels }}
    steps:
      - name: Checkout project at the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/release.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Select configured publishers
        id: selection
        env:
          CHANNEL: ${{ inputs.channel }}
        run: bash "${RF_PIPELINE}/scripts/publication/plan.sh" "${VERSION}" "${CHANNEL}" | tee -a "${GITHUB_OUTPUT}"

  github-release:
    name: Publish GitHub Release
    needs: plan
    if: needs.plan.outputs.github-release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish-github-release
    concurrency:
      group: publish-github-release-${{ inputs.version || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout project at the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/release.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Storage credentials
        env:
          RELEASE_FLOW_S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_FLOW_S3_ACCESS_KEY_ID }}
          RELEASE_FLOW_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_FLOW_S3_SECRET_ACCESS_KEY }}
        run: bash "${RF_PIPELINE}/scripts/storage/ci-credentials.sh"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FLOW_GIT_TOKEN: ${{ github.token }}
        run: |
          rc=0
          bash "${RF_PIPELINE}/scripts/publication/publish.sh" --project-dir "${GITHUB_WORKSPACE}" --version "${VERSION}" --channel github-release || rc=$?
          exit "${rc}"

  oci:
    name: Publish OCI image
    needs: plan
    if: needs.plan.outputs.oci == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish-oci
    concurrency:
      group: publish-oci-${{ inputs.version || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout project at the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/release.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Storage credentials
        env:
          RELEASE_FLOW_S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_FLOW_S3_ACCESS_KEY_ID }}
          RELEASE_FLOW_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_FLOW_S3_SECRET_ACCESS_KEY }}
        run: bash "${RF_PIPELINE}/scripts/storage/ci-credentials.sh"

      - name: Install ORAS (pinned, checksum-verified)
        run: bash "${RF_PIPELINE}/scripts/publication/ci-install-oras.sh"

      - name: Registry login
        env:
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          OCI_PASSWORD: ${{ secrets.OCI_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repository="$(jq -r '.publishers.oci.repository // empty' .release-flow.json)"
          if [[ -z "${repository}" ]]; then
            echo "::notice::oci is not configured; nothing to log in to"
            exit 0
          fi
          registry="${repository%%/*}"
          if [[ -n "${OCI_USERNAME}" && -n "${OCI_PASSWORD}" ]]; then
            printf '%s' "${OCI_PASSWORD}" | oras login "${registry}" --username "${OCI_USERNAME}" --password-stdin
          elif [[ "${registry}" == "ghcr.io" ]]; then
            printf '%s' "${GH_TOKEN}" | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          else
            echo "::error::Set OCI_USERNAME and OCI_PASSWORD in the publish-oci environment for ${registry}"
            exit 1
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FLOW_GIT_TOKEN: ${{ github.token }}
        run: |
          rc=0
          bash "${RF_PIPELINE}/scripts/publication/publish.sh" --project-dir "${GITHUB_WORKSPACE}" --version "${VERSION}" --channel oci || rc=$?
          exit "${rc}"

  crates-io:
    name: Publish to crates.io
    needs: plan
    if: needs.plan.outputs.crates-io == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish-crates-io
    concurrency:
      group: publish-crates-io-${{ inputs.version || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout project at the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/release.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Storage credentials
        env:
          RELEASE_FLOW_S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_FLOW_S3_ACCESS_KEY_ID }}
          RELEASE_FLOW_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_FLOW_S3_SECRET_ACCESS_KEY }}
        run: bash "${RF_PIPELINE}/scripts/storage/ci-credentials.sh"

      # crates-io.sh repackages with `cargo +<version>` recorded in the
      # manifest (build_info.tools.cargo), so exactly that toolchain must be
      # present. The manifest comes from the verified signed tag and stored
      # bytes (resolve.sh); a resolve failure is left to the Publish step,
      # which records it in the ledger.
      - name: Install the manifest-pinned toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FLOW_GIT_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(jq -r '.publishers["crates-io"] // empty' .release-flow.json)" ]]; then
            echo "::notice::crates-io is not configured; no toolchain needed"
            exit 0
          fi
          toolchain=""
          if bash "${RF_PIPELINE}/scripts/publication/resolve.sh" --project-dir "${GITHUB_WORKSPACE}" --version "${VERSION}" --out "${RUNNER_TEMP}/rf-toolchain" >/dev/null; then
            toolchain="$(jq -r '.build_info.tools.cargo // empty' "${RUNNER_TEMP}/rf-toolchain/artifacts/manifest.json" \
              | sed -n 's/^cargo \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p')"
          fi
          rm -rf "${RUNNER_TEMP}/rf-toolchain"
          if [[ -n "${toolchain}" ]]; then
            echo "Installing the manifest-pinned toolchain ${toolchain}"
            rustup toolchain install "${toolchain}" --profile minimal
          else
            rustup toolchain install stable --profile minimal
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FLOW_GIT_TOKEN: ${{ github.token }}
          # Empty when the secret is absent. Unset below so cargo uses crates.io
          # Trusted Publishing (workflow release.yml, environment publish-crates-io).
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            unset CARGO_REGISTRY_TOKEN
          fi
          rc=0
          bash "${RF_PIPELINE}/scripts/publication/publish.sh" --project-dir "${GITHUB_WORKSPACE}" --version "${VERSION}" --channel crates-io || rc=$?
          exit "${rc}"

  docs:
    name: Publish documentation
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish-docs
    concurrency:
      group: publish-docs-${{ inputs.version || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout project at the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/release.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Storage credentials
        env:
          RELEASE_FLOW_S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_FLOW_S3_ACCESS_KEY_ID }}
          RELEASE_FLOW_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_FLOW_S3_SECRET_ACCESS_KEY }}
        run: bash "${RF_PIPELINE}/scripts/storage/ci-credentials.sh"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FLOW_GIT_TOKEN: ${{ github.token }}
        run: |
          rc=0
          bash "${RF_PIPELINE}/scripts/publication/publish.sh" --project-dir "${GITHUB_WORKSPACE}" --version "${VERSION}" --channel docs || rc=$?
          exit "${rc}"

  helm:
    name: Publish Helm chart
    needs: plan
    if: needs.plan.outputs.helm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: publish-helm
    concurrency:
      group: publish-helm-${{ inputs.version || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout project at the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require immutable runtime identity before checkout
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "${RF_WORKFLOW_SHA}" =~ ^[0-9a-f]{40}$ && "${RF_WORKFLOW_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo '::error::Missing immutable workflow identity; github.com is required'; exit 1; }
          case "${RF_WORKFLOW_REF}" in
            "${RF_WORKFLOW_REPOSITORY}/.github/workflows/release.yml@"*) ;;
            *) echo '::error::Unexpected workflow identity'; exit 1 ;;
          esac
          test ! -e .release-flow-pipeline && test ! -L .release-flow-pipeline

      - name: Checkout release-flow pipeline (this workflow's own commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-flow-pipeline
          persist-credentials: false

      - name: Pin release-flow pipeline
        id: pipeline
        env:
          RF_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          RF_WORKFLOW_REF: ${{ job.workflow_ref }}
          RF_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          bash .release-flow-pipeline/scripts/pipeline-pin.sh \
            --checkout .release-flow-pipeline --dest "${RUNNER_TEMP}/release-flow" \
            --workflow-repository "${RF_WORKFLOW_REPOSITORY}" --workflow-ref "${RF_WORKFLOW_REF}" \
            --workflow-sha "${RF_WORKFLOW_SHA}" --repository "${GITHUB_REPOSITORY}" --commit "${GITHUB_SHA}" \
            | tee -a "${GITHUB_OUTPUT}"
          echo "RF_PIPELINE=${RUNNER_TEMP}/release-flow" >> "${GITHUB_ENV}"

      - name: Storage credentials
        env:
          RELEASE_FLOW_S3_ACCESS_KEY_ID: ${{ secrets.RELEASE_FLOW_S3_ACCESS_KEY_ID }}
          RELEASE_FLOW_S3_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_FLOW_S3_SECRET_ACCESS_KEY }}
        run: bash "${RF_PIPELINE}/scripts/storage/ci-credentials.sh"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FLOW_GIT_TOKEN: ${{ github.token }}
        run: |
          rc=0
          bash "${RF_PIPELINE}/scripts/publication/publish.sh" --project-dir "${GITHUB_WORKSPACE}" --version "${VERSION}" --channel helm || rc=$?
          exit "${rc}"

  report:
    name: Publication result
    if: always()
    needs: [plan, github-release, oci, crates-io, docs, helm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require each selected publisher to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "${RESULTS}" | jq -e '
            . as $n | .plan.result == "success" and
            all(["github-release","oci","crates-io","docs","helm"][];
              . as $c | if $n.plan.outputs[$c] == "true" then $n[$c].result == "success"
              else $n[$c].result == "skipped" end)'
