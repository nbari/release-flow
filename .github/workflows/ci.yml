name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop, sandbox]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A production promotion pushes the already-validated candidate commit to main
# and develop; candidate.yml validated that exact SHA, so it is not re-verified.
jobs:
  action:
    name: Marketplace Action runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate this project with the root Action
        uses: ./
        id: self
      - name: Validate a shell consumer in its own directory
        uses: ./
        id: consumer
        with:
          operation: validate
          project-directory: examples/shell
          adapter: tools/adapter.sh
      - name: Assert consumer identity and runtime outputs
        env:
          SELF: ${{ steps.self.outputs.project }}
          CONSUMER: ${{ steps.consumer.outputs.validation-json }}
          RUNTIME: ${{ steps.consumer.outputs.runtime-revision }}
        run: |
          test "${SELF}" = release-flow
          test "${RUNTIME}" = "${GITHUB_SHA}"
          printf '%s' "${CONSUMER}" | jq -e '.valid and .project == "hello" and .adapter_executed == false'

  verify:
    name: Rust and pipeline verification
    if: "${{ !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: ') && contains(github.event.head_commit.message, 'Release-Mode: production')) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Require committed Cargo.lock
        run: test -f Cargo.lock || { echo '::error::Run cargo generate-lockfile and commit Cargo.lock'; exit 1; }

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace --all-features

      - name: Install just (pinned, checksum-verified)
        run: bash tests/pipeline/ci-install-just.sh

      - name: Release-pipeline failure tests
        run: bash tests/pipeline/run.sh

      - name: Build release binary
        run: cargo build --release --locked

      - name: CLI smoke tests
        run: |
          ./target/release/release-flow --version
          ./target/release/release-flow status --json
          ./target/release/release-flow plan patch --json

  ci-ok:
    name: CI OK
    if: "${{ always() && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: ') && contains(github.event.head_commit.message, 'Release-Mode: production')) }}"
    needs: [verify, action]
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs to succeed
        env:
          RESULT: ${{ needs.verify.result }}
          ACTION_RESULT: ${{ needs.action.result }}
        run: |
          if [[ "${RESULT}" != success || "${ACTION_RESULT}" != success ]]; then
            echo "::error::Rust/pipeline verification is ${RESULT}"
            exit 1
          fi
